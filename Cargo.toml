[package]
name = "graphitude"
version = "0.1.0"
edition = "2024"

[dependencies]
derive-where = "1.6.1"
thiserror = "2.0.20"
pathfinding = { version = "4.16.0", optional = true }
bitvec = { version = "1.1.1", optional = true }
dot-parser = { version = "0.6.1", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = [
  "fmt",
], optional = true }
generate_test_macro = { version = "0.1.4", optional = true }
either = "1.18.0"
proptest = { version = "1.11.0", optional = true }
iterable_assertions = { version = "0.1.0", optional = true }

[dev-dependencies]
clap = { version = "4.6.6", features = [
  "derive",
] }
proptest = "1.11.0"
generate_test_macro = "0.1.4"
iterable_assertions = "0.1.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"

[features]
default = [
  "pathfinding",
  "bitvec",
  "dot",
  "tracing",
]
dot = [
  "dep:dot-parser",
]
pathfinding = [
  "dep:pathfinding",
]
bitvec = [
  "dep:bitvec",
]
tracing = [
  "dep:tracing",
  "dep:tracing-subscriber",
]
unchecked = [
]
slow_tests = [
]
test = [
  "dep:proptest",
  "dep:iterable_assertions",
]
